services:
  # 前端服务 - React + Vite + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: village-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - village-network

  # 后端服务 - PHP + Apache
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: village-backend
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_NAME=village_db
      - DB_USER=village_user
      - DB_PASS=village_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - village-network

  # 数据库服务 - MySQL
  db:
    image: mysql:8.0
    container_name: village-db
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=village_db
      - MYSQL_USER=village_user
      - MYSQL_PASSWORD=village_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - village-network

volumes:
  db_data:

networks:
  village-network:
    driver: bridge
